<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <title>Genesis | Contact</title>
</head>
<body>
        <header class="header">
            <a href="index.html" class="header__logo">
            <img src="images/logo.svg" alt="Genesis">
            </a>
            <nav class="header__nav">
                <a href="project.html" class="header__link">Projects</a>
                <a href="contact.html" class="header__link">Contact</a>
            </nav>
        </header>

        <main class="main">
            <section class="contact">
                <div>
                    <h1 class="contact__title">Full set of great features to make your product fresh</h1>
                    <p class="contact__paragraph">Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
                </div>
                <form class="contact__form">
                    <label class="contact__label" for="name">Name</label>
                    <input class="contact__input" type="text" id="name" name="name">

                    <label class="contact__label" for="email">Email</label>
                    <input class="contact__input" type="email" id="email" name="email">

                    <label class="contact__label" for="message">Message</label>
                    <textarea class="contact__input" id="message" name="message" rows="3"></textarea>

                    <button class="contact__button" type="submit">Submit</button>
                </form>
            </section>

            <img class="contact__map" src="images/Map.png" alt="Map showing our location">
        </main>
        <footer class="footer">
            <a href="index.html" class="footer__logo">Genesis</a>
            <nav class="footer__nav">
                <a href="project.html" class="footer__link">Projects</a>
                <a href="contact.html" class="footer__link">Contact</a>
            </nav>
            <div class="footer__social">
                <a href="#"><img src="images/dribbble.png" alt="Dribbble"></a>
                <a href="#"><img src="images/instagram.png" alt="Instagram"></a>
                <a href="#"><img src="images/twitter.png" alt="Twitter"></a>
            </div>
        </footer>
</body>
</html>
